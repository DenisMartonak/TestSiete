<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompletný Sieťový Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background-color: #e9ecef;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            padding: 12px 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            line-height: 1.4;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #dbe2e8;
            border-color: #ced4da;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        .feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
            display: none;
            padding: 15px;
            border-radius: 5px;
            line-height: 1.5;
        }
        .feedback.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        .feedback.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background-color 0.2s;
            font-weight: bold;
        }
        .next-btn:hover, .restart-btn:hover {
            background-color: #0056b3;
        }
        .progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #6c757d;
            font-weight: bold;
        }
        .results {
            text-align: center;
            display: none;
        }
        .results h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-area">
        <h1>Test zo sietí</h1>
        <div class="progress" id="progress">Načítavam...</div>
        <div class="question-text" id="question">Načítavam otázku...</div>
        <div class="options-container" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Ďalšia otázka</button>
    </div>

    <div class="results" id="results-area">
        <h2>Koniec testu!</h2>
        <p id="score-text"></p>
        <button class="restart-btn" style="display: block;" onclick="restartQuiz()">Spustiť test znova</button>
    </div>
</div>

<!-- Načítanie vygenerovaných otázok -->
<script src="data.js"></script>

<script>
    let currentQuestionIndex = 0;
    let score = 0;
    let shuffledQuizData = [];

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");
    const progressEl = document.getElementById("progress");
    const quizArea = document.getElementById("quiz-area");
    const resultsArea = document.getElementById("results-area");

    function initQuiz() {
        if (typeof quizData === 'undefined') {
            questionEl.textContent = "Chyba: Dáta sa nenačítali. Uisti sa, že súbor data.js existuje v rovnakej zložke.";
            return;
        }
        // Zamiešame otázky pred štartom
        shuffledQuizData = [...quizData].sort(() => Math.random() - 0.5);
        loadQuestion();
    }

    function loadQuestion() {
        feedbackEl.className = "feedback";
        feedbackEl.innerHTML = "";
        nextBtn.style.display = "none";
        optionsEl.innerHTML = "";
        
        const currentData = shuffledQuizData[currentQuestionIndex];
        questionEl.textContent = currentData.question;
        progressEl.textContent = `Otázka ${currentQuestionIndex + 1} z ${shuffledQuizData.length}`;

        currentData.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.textContent = option;
            button.classList.add("option-btn");
            button.onclick = () => selectAnswer(index, button);
            optionsEl.appendChild(button);
        });
    }

    function selectAnswer(selectedIndex, buttonClicked) {
        const currentData = shuffledQuizData[currentQuestionIndex];
        const isCorrect = currentData.correctIndices.includes(selectedIndex);
        const allButtons = optionsEl.querySelectorAll(".option-btn");
        
        allButtons.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            buttonClicked.classList.add("correct");
            feedbackEl.textContent = "Správne! ✓";
            feedbackEl.className = "feedback success";
            score++;
        } else {
            buttonClicked.classList.add("wrong");
            currentData.correctIndices.forEach(idx => {
                allButtons[idx].classList.add("correct");
            });
            
            let correctTexts = currentData.correctIndices.map(idx => currentData.options[idx]).join("</strong><br><strong>");
            feedbackEl.innerHTML = `Nesprávne. Správna odpoveď je:<br><strong>${correctTexts}</strong>`;
            feedbackEl.className = "feedback error";
        }

        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < shuffledQuizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizArea.style.display = "none";
        resultsArea.style.display = "block";
        scoreText.innerHTML = `Tvoje skóre je <strong>${score}</strong> z <strong>${shuffledQuizData.length}</strong>.`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        initQuiz();
        quizArea.style.display = "block";
        resultsArea.style.display = "none";
    }

    // Inicializácia pri spustení
    window.onload = initQuiz;
</script>

</body>
</html>
